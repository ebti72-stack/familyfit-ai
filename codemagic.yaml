# FamilyFit AI: iOS build → TestFlight on Codemagic.
# Needs, in Codemagic: the team App Store Connect API key integration (name below)
# and the app record + Bundle ID created in App Store Connect.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Mushaf-Al-Umma-API
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ebti72.familyfit
      vars:
        XCODE_WORKSPACE: ios/FamilyFitAI.xcworkspace
        XCODE_SCHEME: FamilyFitAI
        # Public client values only (bundled into the app by design). Server secrets stay in Supabase.
        EXPO_PUBLIC_SUPABASE_URL: https://dxxpneqljzbwfwbjwbgi.supabase.co
        EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_NxBcqXWZK3QS1muI8Wvjww_VwHCmzrw
        EXPO_PUBLIC_AI_FUNCTIONS: "false"
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Generate the native iOS project
        script: npx expo prebuild --platform ios --clean
      - name: Use signing profiles
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$(app-store-connect apps list --bundle-id-identifier com.ebti72.familyfit --strict-match-identifier --json | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["id"])')" || echo 0)
          cd ios && agvtool new-version -all $((LATEST + 1))
      - name: Build ipa
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
